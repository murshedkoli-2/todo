name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app validates MONGODB_URI at import time, so a placeholder is needed
  # even for jobs that never open a connection.
  MONGODB_URI: mongodb://127.0.0.1:27017/taskflow-ci
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
  NEXTAUTH_URL: http://127.0.0.1:3100

jobs:
  verify:
    name: Type-check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end (public suite)
    runs-on: ubuntu-latest
    # The signed-in journey needs a seeded account, so CI runs the public
    # project only: route protection, security headers, and the auth pages.
    services:
      # Several public-suite tests exercise real endpoints (login rejection,
      # the forgot-password acknowledgement). Without a reachable database
      # those requests hang until the server-selection timeout and the tests
      # fail for the wrong reason.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run public E2E suite
        run: npm run test:e2e:public

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
